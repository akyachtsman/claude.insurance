# qa-live.yml — caller of claude.directives' shared-qa-live.yml (#460 step 4,
# second pilot after claude.prop): Playwright against the live deployed URL
# after each Pages build, and by manual dispatch. Pinned to an exact
# claude.directives commit, not a tag (owner, 2026-10-25). Rollback is
# reverting the pilot PR, which restores the full copy.
#
# This caller keeps the triggers, because they name this project's own deploy:
# branch-source Pages, so the watched workflow is GitHub's managed
# 'pages-build-deployment' (RULE W2 — on an Actions-source project add the
# deploy workflow's `name:`, never replace). The `live` job grants
# `actions: read` for the shared published-lookup job, because a called
# workflow can only narrow the caller's token, never widen it.
#
# Concurrency: the old copy's workflow-level rule is kept below unchanged. The
# shared workflow also carries the same rule on its suite job under its own
# group name (shared-qa-live-…), so the two never share a group and cannot
# deadlock; this one still bounds a whole queued run, lookup included.
#
# ⚠️ The live suite needs the repository VARIABLE APP_URL (not a secret); the
# shared workflow's "Require APP_URL" step fails in seconds without it.
# Secrets go by name, never `secrets: inherit` (claude.directives #467).

name: QA — UI Tests (live)

on:
  workflow_run:
    # + 'Pages Deploy' (pages-deploy.yml), or your own deploy's `name:`, on Actions-source
    workflows: ['pages-build-deployment']
    types: [completed]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Override live app URL (optional)'
        required: false

# Only one live run per ref at a time; a newer trigger cancels the older/queued
# one. The reasoning for each exempt arm: claude.directives
# templates/workflows/qa-live.yml, same block.
concurrency:
  group: qa-live-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('skipped-{0}', github.run_id) || github.event_name == 'workflow_run' && github.event.workflow_run.event != 'dynamic' && (github.event.workflow_run.head_branch != github.event.repository.default_branch || github.event.workflow_run.head_repository.full_name != github.repository) && format('offbranch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

# Least privilege: read the repo and run tests against the live URL.
permissions:
  contents: read

jobs:
  live:
    permissions:
      contents: read
      actions: read
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa-live.yml@55af14e497d7490b7b0d83cf0528f33659df9b41
    with:
      tests-dir: .github/scripts/ui-tests
      # the app_url dispatch input overrides vars.APP_URL if given
      app-url: ${{ inputs.app_url }}
      # The fleet floor for a ui-suite caller; raise it, never lower it.
      ui-timeout-minutes: 120
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}

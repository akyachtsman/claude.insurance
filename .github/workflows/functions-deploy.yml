# functions-deploy.yml — deploy this project's Edge Functions from the repo.
#
# WHY THIS EXISTS, and it is not convenience. Until now the only way to deploy
# was the Supabase MCP's `deploy_edge_function`, which takes file CONTENT inline
# — so a session had to re-emit ~96KB of source into a tool call. That was tried
# on 2026-10-13 and failed twice by sending an incomplete file set; the third
# attempt succeeded only by STRIPPING EVERY COMMENT to make it fit. The live
# function is therefore not the repo's source, and nobody can diff the two.
#
# CLAUDE.md already called the inline path a safety risk, for the right reason:
# `prompt.ts` defines what client data crosses the Anthropic boundary, and a
# single-character corruption there is a safety defect that FR-17 renders as the
# same quiet "not available" notice as every other failure. The fix is not to
# re-emit more carefully. It is to stop re-emitting: this workflow uploads the
# files as they exist in git, so "deployed == repo" becomes true by construction
# rather than by anyone's care.
#
# ⚠️ IT DEPLOYS A NAMED LIST, NEVER "everything". `supabase functions deploy`
# with no slug deploys EVERY directory under supabase/functions/, so a function
# added to the repo would go live the moment it merged, with no decision taken.
# The matrix below is that decision, one row per function, and a new row is the
# place to state the prerequisites it waits on.
#
# notify-enhancement was held out of this list until 2026-10-14 because its claim
# table was written and NOT APPLIED; the entry said to add it "in the same change
# that applies its migration — not before". The migration
# (20261014195128_enhancement_notifications.sql) was applied 2026-10-14 with the
# catalog read back, so the condition is met and the row is here.
#
# ⚠️ EVERY ROW REDEPLOYS ON EVERY QUALIFYING PUSH, including a push that touched
# only the other function. That is an idempotent re-upload of identical source —
# the same trade already accepted above for config.toml, and the alternative is a
# per-function path filter that has to be kept in step with each file's internals.
#
# Required setup (one repository secret):
#   SUPABASE_ACCESS_TOKEN — a Supabase personal access token.
#     Supabase dashboard -> account menu -> Access Tokens -> Generate new token.
#     Add it at Settings -> Secrets and variables -> Actions -> New repository secret.
#   ⚠️ SCOPE THE TOKEN. This said flatly that "a Supabase PAT is ACCOUNT-WIDE" and
#   that narrowing it was a before-production task. No longer true: measured in the
#   dashboard 2026-10-14, token creation offers Resource access (Project /
#   Organization) and per-capability permissions. Create this one as:
#       Expires in       Never
#       Resource access  Project -> the `insurance` project ONLY
#       Permissions      Application services -> Edge Functions -> Read-write
#                        EVERYTHING ELSE None
#   ⚠️ `Never` is deliberate, and the gate below is why it matters: it checks only
#   that the secret is NON-EMPTY, so an expired or revoked token sails past it and
#   dies later at the CLI with an auth error that reads like an outage. Present is
#   not valid — the same lesson as `hasKeys` in CLAUDE.md.
#   ⚠️ Leave `Edge Function Secrets` (HIGH RISK) at None, so this token cannot READ
#   ANTHROPIC_API_KEY. That bounds the blast radius without closing it: code this
#   token deploys still runs with access to that secret at runtime.
#   ⚠️ Access CANNOT be changed after creation; widening means a new token.
#   The account also holds the `apfp` project (CLAUDE.md, "Shared Supabase
#   account"), which is what the project scoping protects. `--project-ref` below
#   pins what this workflow touches; the token scoping pins what it COULD touch.

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    # Only when the function's own source moves. A README or CLAUDE.md edit must
    # not redeploy a live endpoint.
    paths:
      - "supabase/functions/help-ask/**"
      - "supabase/functions/notify-enhancement/**"
      - ".github/workflows/functions-deploy.yml"
      # ⚠️ config.toml IS A DEPLOY INPUT, not documentation. The CLI reads it for
      # per-function settings (verify_jwt, import maps, entrypoints), so a
      # config-only change would otherwise merge and leave production on the old
      # configuration until some unrelated source edit happened along. Today this
      # repo deliberately carries NO [functions.help-ask] block — which is
      # exactly why the gap was invisible: there is nothing there to change yet.
      # Found by an automated review of the merged PR that added this file.
      # It does mean a config change for ANOTHER function redeploys help-ask.
      # That is an idempotent re-upload of identical source, and the alternative
      # is a path filter that has to be kept in step with a file's internals.
      - "supabase/config.toml"
  # Manual escape hatch: lets a deploy be re-run without an empty commit, which
  # the drive-to-green rules forbid for CI and which is no better here.
  workflow_dispatch:

# Two deploys of the same function racing would make "what is live" a matter of
# which finished last. cancel-in-progress is FALSE on purpose: a deploy that has
# started should finish, because a cancelled one leaves the previous version live
# with nothing saying so.
#
# ⚠️ AND THE GROUP ALONE DOES NOT CLOSE THE RACE — it serializes, it does not
# ORDER. GitHub gives no FIFO guarantee for queued runs, so with two pushes close
# together an OLDER run can execute second and upload OLDER code over newer. This
# repo already records that exact lesson for pages-retry.yml ("a concurrency
# group is mutual exclusion, not FIFO"), and this file shipped without carrying
# it over; found by an automated review of the merged PR that added it. The
# freshness check in the job below is what actually closes it.
#
# ⚠️ THE GROUP IS PER-FUNCTION AND LIVES ON THE JOB, not here. A single
# repo-wide group would serialize a help-ask deploy behind a notify-enhancement
# one for no reason — they touch different endpoints and cannot race each other.
# A top-level `concurrency:` cannot see `matrix`, so it has to be on the job.

# `actions: read` is for the successor check below — listing this workflow's own
# runs. `contents: read` alone cannot, and the check failing open would leave the
# stale-overwrite hole it exists to close. Nothing here writes anything on GitHub.
permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: ${{ matrix.fn }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One job per function, independent: `fail-fast: false` so a broken deploy of
    # one does not cancel the other's, which would leave "what is live" depending
    # on which failed first.
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠️ `probe` IS THE UNAUTHENTICATED POST BODY, AND IT MUST BE ONE THE
          # HANDLER WOULD ACCEPT. Measured 2026-10-14: BOTH handlers parse and
          # VALIDATE the body BEFORE they look at the Authorization header
          # (help-ask handler.ts 478-483 then 486; notify-enhancement index.ts
          # 447-450 then 456). Probe 2 detects "verify_jwt is OFF" by finding the
          # handler's own `{"error":"unauthorized"}` — which the handler only
          # reaches if the body got past validation. An invalid body returns 400
          # `bad_request` instead, the `case` below reports "Unexpected 400", and
          # the real cause (every unauthenticated request reaching the worker) is
          # never named. So a generic `{}` would have silently degraded the one
          # check this step exists for.
          # With verify_jwt ON — the expected state — neither body reaches the
          # worker at all, so neither is a billable call and neither can create
          # anything. The all-zeros requestId is belt for the case where it does:
          # it matches no row, so the probe cannot take a notification claim.
          - fn: help-ask
            probe: '{"question":"ping"}'
          - fn: notify-enhancement
            probe: '{"requestId":"00000000-0000-0000-0000-000000000000","event":"requested"}'
    concurrency:
      group: functions-deploy-${{ matrix.fn }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # ⚠️ IS A NEWER DEPLOY RUN ALREADY QUEUED? See the concurrency note above:
      # the group serializes but does not order, so a superseded run reaching
      # this point would publish stale code with nothing saying so — and FR-17
      # means nobody could tell from the product.
      #
      # ⚠️ THE FIRST VERSION OF THIS COMPARED SHAs AGAINST main's ABSOLUTE HEAD,
      # AND THAT WAS WRONG — a P1 in the review of the PR that added it, and the
      # error was in my reasoning rather than the code. The comment claimed "this
      # workflow fires on every qualifying push, so a superseded run always has a
      # newer run behind it". True only of commits that touch the watched PATHS,
      # and main's head need not be one: push a function change, then push a
      # CLAUDE.md edit, and the second fires nothing while making the first look
      # stale. The function change would then sit undeployed until a manual
      # dispatch. Two of my own changes in one commit — tightening the path
      # filter and adding this check — interacting to produce a hole neither had
      # alone.
      #
      # So it now asks the question Codex's finding named: does a SUCCESSOR
      # DEPLOY exist? The runs API lists runs of THIS workflow only, and such a
      # run exists exactly when a qualifying push (or a dispatch) happened — so
      # the path filter is consulted by construction and there is no second copy
      # of the path list to drift. A higher run id means a newer run of this
      # workflow is queued or running, and it will deploy.
      #
      # ⚠️ KEYED ON THE WORKFLOW'S FILE NAME, which is NOT the trap recorded for
      # pages-retry.yml. That one is about a workflow's two DISPLAY names
      # (`pages-build-deployment` in the workflows API, `pages build and
      # deployment` in the runs API), where filtering by the wrong one silently
      # matches nothing. The file name is a documented, exact identifier for the
      # workflow endpoint, and it is this file — so it cannot name the wrong one.
      #
      # If the check itself cannot run, PROCEED: an unverifiable check is not
      # evidence of obsolescence, and the stale overwrite then needs a double
      # failure (an inverted order AND a failed API call) whose recovery is one
      # workflow_dispatch. Same direction as pages-retry.yml, for the same
      # reason.
      #
      # workflow_dispatch is exempt. It is the manual escape hatch, and someone
      # dispatching deliberately is asking for what they dispatched.
      - name: Is a newer deploy run already queued?
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — successor check skipped by design"
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if newest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/functions-deploy.yml/runs?per_page=1" \
                        --jq '.workflow_runs[0].id // 0'); then
            if [ "${newest:-0}" -gt "${GITHUB_RUN_ID}" ]; then
              echo "::notice::Run ${GITHUB_RUN_ID} (commit ${GITHUB_SHA:0:7}) is superseded by newer deploy run ${newest} — skipping, so an older commit is not deployed over a newer one. That run deploys the newer code."
              echo "current=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Run ${GITHUB_RUN_ID} is the newest deploy run (${newest}) — proceeding."
          else
            echo "::warning::Could not list this workflow's runs to check for a successor; proceeding. If this deploy lands out of order, re-run the workflow manually."
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      # Fail LOUDLY and early on a missing token. Without this the CLI's own
      # error is an auth failure several steps later, which reads like an outage
      # rather than like "the one setup step was never done".
      - name: Require SUPABASE_ACCESS_TOKEN
        if: steps.fresh.outputs.current == 'true'
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Generate one in the"
            echo "::error::Supabase dashboard (account menu -> Access Tokens) and add it"
            echo "::error::under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # ⚠️ PINNED TO A COMMIT SHA, AND THE VERSION PINNED TOO — not `@v3` and not
      # `latest`. A tag is mutable: whoever controls it can repoint it at new
      # code, and this step hands that code a Supabase PAT that reaches every
      # project on the account. That is the esm.sh lesson from CLAUDE.md on a
      # second surface — `index.ts` already pins `supabase-js@2.117.2` and
      # `@anthropic-ai/sdk@0.131.0` for exactly this reason, so a floating action
      # here contradicted the repo's own standard. Flagged by an automated
      # security review of this file; the finding was correct.
      #
      # Resolved by `git ls-remote` on 2026-10-13, not recalled:
      #   supabase/setup-cli v3.0.1 -> 45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
      # ⚠️ The first draft pinned `@v1`, which is THREE majors stale — the
      # action's own README documents `@v3`. Pinning is not enough on its own;
      # pinning the wrong thing freezes the wrong code.
      #
      # To update: re-run the ls-remote, bump both the SHA and the trailing
      # comment together, and say in the commit why the bump was needed.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.fresh.outputs.current == 'true'
        with:
          # A fixed CLI version, published to npm. `latest` would mean a deploy
          # path that changes under us between two identical pushes.
          version: 2.120.0

      # A function's modules must go together: help-ask's index.ts imports
      # handler.ts and prompt.ts, so a partial upload fails at bundle time. The
      # CLI sends the whole directory, which is the entire point of this workflow.
      #
      # verify_jwt is not passed on the command line: supabase/config.toml pins
      # `verify_jwt = true` for BOTH functions, and the CLI reads it from there.
      #
      # ⚠️ THAT PIN EXISTS BECAUSE THIS COMMENT WAS WRONG, AND THE SMOKE STEP
      # BELOW IS WHAT PROVED IT. It used to read: "config.toml deliberately
      # carries no [functions.*] block, so the CLI applies the default (true)".
      # Measured 2026-10-14 on the first run that deployed notify-enhancement:
      # the deploy SUCCEEDED and uploaded the repo's source (version 3,
      # entrypoint under /home/runner/work/…) — and the function stayed
      # `verify_jwt: false`, because it already was. An absent block does not
      # ASSERT the default; it sends nothing, and the platform keeps the existing
      # value. help-ask looked like evidence for the old reading only because it
      # was already true, so "preserve" and "apply the default" could not be told
      # apart until a function with a false flag went through.
      #
      # The probe then caught it exactly as designed: an unauthenticated POST
      # reached the HANDLER, which answered its own {"error":"unauthorized"}.
      # The single-401 check this step replaced would have gone green.
      #
      # ⚠️ So notify-enhancement's flag is corrected by the PIN, not by the
      # deploy's defaulting. Before any of this it was live at version 2 with
      # verify_jwt FALSE and an entrypoint under /tmp/user_fn_… — an old inline
      # tool-call deploy of the PRE-REWRITE source, which answered 404 to every
      # caller because service_role holds no table privileges here.
      - name: Deploy ${{ matrix.fn }}
        if: steps.fresh.outputs.current == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ${{ matrix.fn }} \
            --project-ref bdsegmjcgfmgzuxwiplj

      # ── SMOKE: TWO PROBES, BECAUSE ONE 401 PROVED NEITHER THING ─────────────
      #
      # ⚠️ THE FIRST VERSION OF THIS STEP ASSERTED A SINGLE UNAUTHENTICATED 401
      # AND CLAIMED IT PROVED "the route exists and is JWT-gated". It proved
      # neither, and an automated review of the merged PR that added it said so
      # in two parts, both correct:
      #
      #   · With verify_jwt ON the gateway answers 401 BEFORE the function runs,
      #     so a worker that fails to import — a bad specifier in prompt.ts, say,
      #     the module that defines what client data crosses the Anthropic
      #     boundary — still produced a green deploy. That is precisely the
      #     failure this whole workflow exists to make impossible, and FR-17
      #     renders it as the same quiet notice as everything else.
      #   · If verify_jwt were accidentally OFF, handler.ts itself answers 401 to
      #     a missing Authorization header. The same status, from a completely
      #     different place, so the check could not tell them apart.
      #
      # So: one probe that MUST reach the function, and one that MUST NOT.
      #
      # Neither sends a question, so neither is a billable provider call — the
      # cost note on qa-live's four-asks-per-deploy applies here too.
      - name: Smoke — the worker boots, and the gateway gates it
        if: steps.fresh.outputs.current == 'true'
        env:
          FN: https://bdsegmjcgfmgzuxwiplj.supabase.co/functions/v1/${{ matrix.fn }}
          PROBE: ${{ matrix.probe }}
        run: |
          set -u

          # PROBE 1 — OPTIONS must REACH the function. verify_jwt lets a preflight
          # through (measured on this project 2026-10-07 against desk-ask, which
          # carried the same flag; that stub was deleted 2026-10-14, so the
          # measurement stands but has no live control), and handler.ts answers
          # it with the literal
          # body `ok` — both functions do, measured from source. So that body is
          # proof the deployed worker booted, resolved every module it imports,
          # and is running THIS repo's code. It depends on no
          # response header, deliberately: an assertion on x-deno-execution-id
          # would be guessing at a name nobody here can verify from a session.
          pre=$(curl -s -o /tmp/pre.body -w '%{http_code}' -X OPTIONS "$FN")
          echo "OPTIONS -> HTTP $pre, body: $(cat /tmp/pre.body)"
          if [ "$pre" = "404" ]; then
            echo "::error::404 on a preflight — the function is not deployed at that slug."
            exit 1
          fi
          if [ "$pre" -lt 200 ] || [ "$pre" -ge 300 ] || [ "$(cat /tmp/pre.body)" != "ok" ]; then
            echo "::error::The deployed worker did not answer a preflight with 'ok'."
            echo "::error::Either it failed to boot (check the function logs for an"
            echo "::error::import error — e.g. help-ask's index.ts needs handler.ts AND"
            echo "::error::prompt.ts), or the"
            echo "::error::gateway stopped forwarding OPTIONS. The status and body above"
            echo "::error::say which: a 401 means the gateway refused the preflight;"
            echo "::error::a 5xx or an empty body means the worker itself."
            exit 1
          fi

          # PROBE 2 — an unauthenticated POST must NOT reach the function. The
          # status alone cannot say that (see the header), so the BODY decides:
          # handler.ts answers `{"error":"unauthorized"}` and the gateway answers
          # its own shape. Finding that body here means verify_jwt is off and
          # every unauthenticated request is reaching the worker.
          code=$(curl -s -o /tmp/post.body -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "$PROBE" "$FN")
          body=$(cat /tmp/post.body)
          echo "unauthenticated POST -> HTTP $code, body: $body"
          case "$code" in
            401) ;;
            404) echo "::error::404 — the function is not deployed at that slug."; exit 1 ;;
            *)   echo "::error::Unexpected $code. Expected 401 from the verify_jwt gateway."; exit 1 ;;
          esac
          if printf '%s' "$body" | grep -q '"error"[[:space:]]*:[[:space:]]*"unauthorized"'; then
            echo "::error::That 401 came from handler.ts, not from the gateway — so"
            echo "::error::verify_jwt is OFF and unauthenticated requests are reaching the"
            echo "::error::worker. Redeploy with the default (config.toml must carry no"
            echo "::error::[functions.${{ matrix.fn }}] verify_jwt = false)."
            exit 1
          fi
          echo "OK: the worker boots (OPTIONS reached it) and the gateway refuses an unauthenticated POST before it runs."

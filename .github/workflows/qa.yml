# qa.yml — Static checks + Playwright against a local server.
# Copy to .github/workflows/qa.yml in your project.
#
# Jobs:
#   static-checks — secret scan; a blocking gate, runs on every trigger.
#   ui-changes    — diffs the PR against its base and decides whether the
#                   browser job is needed. Non-PR events (push to main)
#                   always run UI tests.
#   ui-tests      — Playwright against a local server; runs only when an
#                   index.html exists and UI-relevant paths changed (so the
#                   scaffold/bootstrap PR stays clean). BLOCKING. It serves
#                   static files and never renders the Keep, so qa-live.yml
#                   stays the authoritative gate for layout; this one covers
#                   the public flows.
#
# Required setup:
#   - Add TEST_AUTH_CREDENTIAL as a repository secret (value from CLAUDE.md)
#   - Set UI_TESTS_DIR below to the path of your Playwright test directory
#   - Adjust the UI_PATHS regex in the ui-changes job to your project layout

name: QA — Static + UI Tests

on:
  pull_request:
    branches: [main]
  # push covers only main (the post-merge run). Feature-branch commits are
  # covered by the pull_request trigger — listing them here too made every
  # PR commit run the whole workflow twice. Accepted trade-off: commits
  # pushed before a PR exists get no run; the draft-PR-immediately flow
  # makes that window moments.
  push:
    branches: [main]

# Least privilege: these jobs only read the repo and run tests.
permissions:
  contents: read

env:
  # Path to the directory containing playwright.config.js and package.json
  UI_TESTS_DIR: .github/scripts/ui-tests

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Secret scan ────────────────────────────────────────────────────────
      # Flags common API token patterns before any tests run.
      - name: Secret scan
        run: |
          # Canonical secret-scan pattern — keep identical to global.md and qa-response.yml.
          if grep -rlE \
            'pat[A-Za-z0-9]{14}\.[A-Za-z0-9]{40,}|pat[A-Za-z0-9]{17}\.[a-f0-9]{64}|pat[lr]_[A-Za-z0-9]{10,}|sk-[A-Za-z0-9]{20,}|xoxb[-]' \
            --include="*.js" --include="*.html" --include="*.css" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "ERROR: potential API token found in source files"
            exit 1
          fi

      # ── Contrast guardrail ───────────────────────────────────────────────────
      # WCAG AA check against css/tokens.css (this project's design tokens).
      # Exits with a notice (no failure) if css/tokens.css is ever absent.
      - name: Contrast guardrail (WCAG AA)
        run: node .github/scripts/check-contrast.js

  unit-tests:
    name: Unit Tests + HTML Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # html-validate 11.x needs Node >= 22 (fs.globSync)

      # Pure-logic unit tests (node:test) — no browser/backend needed, so these
      # are a deterministic, blocking gate. Explicit file list keeps discovery
      # off the Playwright specs and node_modules under .github/scripts.
      - name: Unit tests
        run: node --test $(find js -name '*.test.mjs')

      - name: Validate HTML
        run: npx --yes html-validate@11.5.6 index.html

  ui-changes:
    name: Detect UI-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.diff.outputs.ui }}

    steps:
      - name: Checkout (full history for base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against PR base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Per-project: paths whose changes warrant a browser run.
          UI_PATHS: '^(index\.html$|\.github/scripts/ui-tests/|\.github/workflows/qa\.yml$)'
        run: |
          # No app yet (no index.html in the repo) → nothing to browser-test.
          # Keeps the scaffold/bootstrap PR clean: skip until the app exists.
          if [ ! -f index.html ]; then
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No index.html yet — skipping browser job."
            exit 0
          fi
          # Non-PR events (push to main) always run UI tests unconditionally.
          if [ "$EVENT" != "pull_request" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — UI tests run unconditionally."
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE "$UI_PATHS"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "UI-relevant changes detected."
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No UI-relevant changes — skipping browser job."
          fi

  ui-tests:
    name: UI Tests (local server)
    needs: [static-checks, ui-changes]
    if: needs.ui-changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # 60, deliberately generous — an INFRASTRUCTURE backstop, not a test-duration
    # bound. Measured on this repo (run 32655105739, the run that landed this
    # line): the whole job takes 2m30s, of which the browser install is 45s and
    # the 36-test Playwright run is 1m24s. So 20 was NOT below the observed path
    # — do not repeat that claim, it was imported from an upstream measurement
    # and is false here.
    #
    # What 20 does not cover is the tail. This job has no actions/cache for
    # ~/.cache/ms-playwright (unlike the ui-suite composite qa-live uses), so it
    # re-downloads ~215 MiB of chromium + webkit on EVERY run, and the identical
    # command was measured at 21m25s upstream on a degraded CDN path
    # (claude.directives #290). Nothing here is immune to that — same command,
    # same CDN, same runner class. A job cancelled on its bound reads as
    # inconclusive rather than red, so that tail would go unchased.
    #
    # Per-test hangs are already caught by playwright.config.js `timeout: 30_000`;
    # this ceiling exists only for the install tail. If you lower it, measure the
    # COLD path on a bad day — a warm timing says nothing about the exposure.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `cache: npm` requires a committed package-lock.json at the path below.
      # Generate it once (`npm install` in UI_TESTS_DIR) and COMMIT it, or this
      # step fails with "Dependencies lock file is not found".
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.UI_TESTS_DIR }}/package-lock.json

      - name: Install test dependencies
        run: npm install
        working-directory: ${{ env.UI_TESTS_DIR }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: ${{ env.UI_TESTS_DIR }}

      # ── Start local server ─────────────────────────────────────────────────
      # Adjust '.' to your build output directory if needed (e.g. dist, public).
      # http-server is a pinned devDependency installed in UI_TESTS_DIR (above). Invoke
      # its binary by path while staying at the repo root, so '.' still serves the app
      # root AND nothing is fetched at runtime (works under locked egress). `npx
      # --no-install` from the root would fail — the bin lives under UI_TESTS_DIR, not root.
      - name: Start local server
        run: |
          "./$UI_TESTS_DIR/node_modules/.bin/http-server" . -p 8080 --silent &
          sleep 2

      # BLOCKING — deliberately. This step carried `continue-on-error: true`.
      #
      # The old justification was that the backend is unreachable on CI
      # runners, so API-dependent scenarios failed with "API status: no call"
      # and the job had to be allowed to fail. That reason no longer exists.
      # The reachability split made S2/S3/S9 skip on LIVE_TARGET — is the
      # target a live host? — rather than on credential-absence, so an
      # unreachable backend now SKIPS those scenarios instead of failing them.
      # Removing that coupling is what makes this tier safe to gate on.
      #
      # Why the flag had to go: continue-on-error rewrites a failed step's
      # conclusion to success, so the job reported green regardless of what
      # the tests did. Its real result could only be learned by a person
      # opening the log, on every run, forever — a check whose failure is
      # invisible proves nothing while looking like coverage. Verified green
      # from the logs (not the conclusions) of 02797ce and 7597322 —
      # 24 passed / 12 skipped / 0 failed on each — before flipping.
      #
      # CAVEAT, do not lose this: the local tier serves static files and never
      # renders the Keep, and css/keep.css holds all four tablet-band
      # breakpoints (1040/900/880/860). Green here is NOT coverage proof for
      # the viewport matrix — qa-live.yml is the gate that proves layout.
      # This gate is narrow. It just reports honestly.
      - name: Run Playwright tests
        env:
          APP_URL: http://localhost:8080
          TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
        run: npx playwright test
        working-directory: ${{ env.UI_TESTS_DIR }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-local
          path: |
            .agent-reports/screenshots/
            .agent-reports/playwright-results.json
          retention-days: 7

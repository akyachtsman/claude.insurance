# qa.yml — caller of claude.directives' shared-qa.yml (#460 step 4, second
# pilot after claude.prop). The shared workflow runs the secret scan, the
# contrast guardrail and the Playwright suite against a local server; its jobs
# show as "qa / Static Checks" and "qa / UI Tests (local server)". What it does
# and how it differs from the old copy: claude.directives
# docs/internal/shared-workflows.md.
#
# Pinned to an exact claude.directives commit, not a tag (owner, 2026-10-25).
# Moved 2026-10-27 to d32a9d0, v1.1.0's commit, which adds the web guards
# (claude.directives #493). qa-live.yml and qa-response.yml stay on 55af14e.
# Rollback is reverting the pilot PR, which restores the full copy.
#
# Settings the old copy kept in `env:` (UI_TESTS_DIR, BUILD_CMD, SITE_DIR) are
# `with:` inputs below, because `env` does not pass into a called workflow.
# BUILD_PATHS stays in the top-level `env:`: the toolkit's Pages edit reminder
# reads it there, no workflow does.
#
# PROJECT-SPECIFIC: two sibling jobs carry what the old copy ran that the shared
# workflow has no slot for, and `qa` waits on both, so a red project check
# stops the suite:
#   project-guards — the asset manifest, undefined-call and Keep back-route
#                    guards (the old copy ran them inside Static Checks);
#   unit-tests     — the node:test unit tests and HTML validation.
# Contrast runs this project's own check-contrast.js through `contrast-script`:
# it carries two `.k-ilink` pairs the shared copy does not (CLAUDE.md ->
# Upstream Divergences). It needs .github/scripts/package.json beside it.
#
# Secrets go by name, never `secrets: inherit` (claude.directives #467).

name: QA — Static + UI Tests

on:
  pull_request:
    branches: [main]
  # push covers only main (the post-merge run). Feature-branch commits are
  # covered by the pull_request trigger — listing them here too made every
  # PR commit run the whole workflow twice. Accepted trade-off: commits
  # pushed before a PR exists get no run; the draft-PR-immediately flow
  # makes that window moments.
  push:
    branches: [main]
  # Manual escape hatch: pull_request event delivery can die provider-side
  # (observed 2026-07-19) — this lets a session or the Actions tab run the
  # gate by hand on any ref. A dispatch run on the PR's head SHA satisfies
  # the merge gate. See docs/standards/ci-triage.md → "CI never registered".
  workflow_dispatch:

# Least privilege: these jobs only read the repo and run tests.
permissions:
  contents: read

env:
  # Extended regex of the build INPUTS. Not read by any workflow: the toolkit's
  # Pages edit reminder reads it to know which edits change the deployed site.
  # Empty: no build (branch-source Pages).
  BUILD_PATHS: ''

jobs:
  # PROJECT-SPECIFIC — no upstream equivalent; /refresh-repo must DIFF, not drop.
  project-guards:
    name: Project Guards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── Project-specific guards (NO upstream equivalent) ────────────────────
      # /refresh-repo must DIFF, not drop. Each exists for a defect that shipped
      # here; none is covered by anything upstream.
      - name: Asset manifest guard
        # index.html hand-maintains three lists with nothing validating them:
        # MODULES (the cache-busting import map), SHEETS, and the <noscript>
        # stylesheet links. An omission from MODULES is SILENT — the module still
        # loads, it just resolves to an UNVERSIONED url, so returning browsers
        # keep a stale copy after a deploy and nothing goes red. That already
        # happened: 2be517a reads "they were omitted, so a deploy could serve a
        # stale copy". The guard walks the real import graph from js/main.js
        # rather than globbing, and exits 2 (CANNOT CHECK) rather than passing if
        # an input is missing. Negative-tested on all four cases.
        run: node .github/scripts/check-asset-manifest.js

      - name: Undefined-call guard
        # Every called identifier in a browser module must be declared, imported
        # or a known global. This class shipped TWICE in one PR: a function
        # copy-pasted during a module split without its import, and a scripted
        # import edit whose single-line regex missed a MULTI-LINE import block.
        # Nothing else catches it — `node --check` only parses (a free
        # identifier is legal until it runs), the import checks only prove the
        # specifier resolves, and the UI suite skips the Keep scenarios on a
        # localhost server, so the page that broke is never opened there.
        # Deliberately conservative: it under-reports rather than cry wolf.
        run: node .github/scripts/check-undefined-calls.js

      - name: Keep back-destination routes are all classified
        # `originRoute()` decides where a back control may point. It held a
        # DENY-list of routes that must not be offered, and that list was found
        # incomplete TWICE on one PR — `#/keep/login` (so every sign-in offered a
        # "Back" to the login card) and the bare `#/keep/request` (so My requests
        # pointed at the form it had just submitted, inviting a duplicate
        # request). A deny-list is incomplete by construction: a route added
        # later is a candidate omission and nothing fails when one is missed.
        # The table is now an allow-list, and this asserts its keys are EXACTLY
        # dispatchKeep's cases — so a new Keep route cannot ship unclassified,
        # and a stale entry cannot outlive its route. Set equality, not
        # containment, and it exits non-zero rather than certify a comparison it
        # could not make. Mutation-tested on all four cases.
        run: node .github/scripts/check-keep-back-routes.mjs

  # PROJECT-SPECIFIC — no upstream equivalent; /refresh-repo must DIFF, not drop.
  # Pure-logic unit tests (node:test) plus HTML validation. Neither needs a
  # browser or a backend, so this is a deterministic blocking gate that answers
  # long before the UI job finishes (#202).
  unit-tests:
    name: Unit Tests + HTML Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'  # html-validate 11.x needs Node >= 22 (fs.globSync)

      # Explicit file list keeps discovery off the Playwright specs and off
      # node_modules under .github/scripts.
      - name: Unit tests
        # `js` AND `supabase/functions`: the Help desk's prompt builder is a Deno
        # module, Deno is installed in neither this runner nor the agent sandbox,
        # and that module is where feature 003's fact/advice boundary is written.
        # A safety boundary whose only test nobody can execute is not tested.
        # Node 22 strips TypeScript types natively, so its *.node.test.mjs twin
        # imports the .ts unchanged — no build step, no second copy of the logic.
        run: node --test $(find js supabase/functions -name '*.test.mjs')

      - name: Validate HTML
        # npm_config_legacy_peer_deps IS LOAD-BEARING, and it took a red CI run
        # to find out. `npx --yes html-validate@11.5.6` installs into a cold npx
        # cache on every runner, and npm 10.9.7 CRASHES in that install:
        #     npm error Cannot read properties of null (reading 'edgesOut')
        #     at #loadPeerSet (@npmcli/arborist/lib/arborist/build-ideal-tree.js:1289)
        # i.e. a crash inside arborist's PEER-DEPENDENCY resolver, not an
        # ERESOLVE conflict it reports and recovers from. legacy-peer-deps skips
        # that code path entirely, which is why it fixes it.
        #
        # ⚠️ IT IS INTERMITTENT ONLY BECAUSE OF THE CACHE, and that is what hid
        # it. Measured here 2026-10-15, two cold caches one minute apart,
        # everything else identical:
        #     cold + plain                    -> exit 1 (the crash above)
        #     cold + legacy_peer_deps=true    -> exit 0
        # A WARM cache passes either way — so this step was green on every run
        # whose runner happened to resolve the tree, and `index.html` was
        # byte-identical between the last green run and the red one. Do not read
        # a green run as evidence the flag is unnecessary; the only informative
        # test is a cold cache.
        #
        # Reported upstream by a peer session (claude.directives#455) before it
        # was ever seen here, and dismissed on a WARM-cache measurement.
        env:
          npm_config_legacy_peer_deps: 'true'
        run: npx --yes html-validate@11.5.6 index.html

  qa:
    needs: [project-guards, unit-tests]
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa.yml@d32a9d0cb6f17b77c3771503ec0bfe95931c9043
    with:
      # Path to the directory containing playwright.config.js and package.json
      tests-dir: .github/scripts/ui-tests
      # No build: branch-source Pages, the repo root is served.
      build-cmd: ''
      site-dir: '.'
      # This project's own copy, with its two added .k-ilink pairs. Tokens are
      # css/tokens.css, the script's default, so no --tokens is needed.
      contrast-script: .github/scripts/check-contrast.js
      contrast-args: ''
      # Blocking: the suite runs fully against the bundled local server.
      advisory-run: false
      # The fleet floor for a ui-suite caller; raise it, never lower it.
      ui-timeout-minutes: 120
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}

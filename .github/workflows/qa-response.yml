# qa-response.yml — caller of claude.directives' shared-qa-response.yml (#460
# step 4, second pilot after claude.prop): event-driven QA against the live
# URL, started by repository_dispatch or by hand. Pinned to an exact
# claude.directives commit, not a tag (owner, 2026-10-25). Rollback is
# reverting the pilot PR, which restores the full copy.
#
# Dispatch it from a session with the GitHub API:
#   POST /repos/<owner>/<repo>/dispatches  {"event_type":"manual-qa-trigger"}
#
# ⚠️ WHICH REVISION THIS TESTS. A repository_dispatch carries no revision, so it
# tests the DEFAULT BRANCH's specs, never the branch a session dispatched from;
# the shared workflow says so in its step summary. Use the PR's own qa.yml run
# for branch changes. Never take a ref from client_payload: it is
# attacker-influenceable.
#
# Needs the repository VARIABLE APP_URL. Secrets go by name, never
# `secrets: inherit` (claude.directives #467).

name: QA — Event-Driven Response

on:
  repository_dispatch:
    types:
      - qa-email-received       # triggered when Gmail monitor detects a relevant email
      - test-failure-reported   # triggered when another workflow reports a failure
      - manual-qa-trigger       # triggered manually by an active session

  # Also allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual session trigger'

# Least privilege: read the repo and run tests.
permissions:
  contents: read

jobs:
  respond:
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa-response.yml@55af14e497d7490b7b0d83cf0528f33659df9b41
    with:
      tests-dir: .github/scripts/ui-tests
      # The fleet floor for a ui-suite caller; raise it, never lower it.
      ui-timeout-minutes: 120
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}

name: Pages Deploy Retry
# Auto-heals transient GitHub Pages deploy failures. The managed "pages build and
# deployment" workflow occasionally fails its publish step with "Deployment failed,
# try again later." — a GitHub-side blip, not a build problem — which otherwise
# leaves the site on the previous version until someone manually re-runs it.
#
# This workflow watches that managed deploy and, on a failure, re-runs it
# automatically (a full re-run, which is what reliably clears the transient
# error). It is bounded by run_attempt so a genuinely broken deploy can't loop:
# after a few tries it stops and lets pages-monitor.yml open its tracking issue.
#
# Purely additive — no change to the Pages source or the existing deploy/monitor.
on:
  workflow_run:
    # The managed Pages workflow's actual `name` is its file slug
    # "pages-build-deployment" (verified via the Actions API), not the prose
    # title shown in the UI — the prose form never matches, so the retry
    # would never fire.
    # ⚠️ RULE W3 — BRANCH-SOURCE ONLY. Do NOT add your own deploy workflow here:
    # this re-runs the whole watched run, so pointing it at a project-owned
    # deploy replays that workflow's entire build. Actions-source projects build
    # retry into their own deploy workflow instead (Automation 4b).
    #
    # ⚠️ ACTION ON AN ACTIONS-SOURCE SWITCH — pick ONE, and handle the guard
    # entry differently in each. Nothing will tell you to: 'pages-build-
    # deployment' is GitHub-managed, so the name still RESOLVES after the
    # switch and W1, workflow-ref-guard and every other static check stay green.
    #   (a) DELETE this file  -> DROP its REQUIRED entry in the same edit.
    #       The retry then lives in your deploy (pages-deploy.yml's deploy job
    #       already has one; a deploy of your own must build its own, W3).
    #   (b) REPOINT it at your own deploy, under W3's idempotent exception
    #       -> UPDATE the REQUIRED entry to that deploy's name; do NOT drop it.
    #       Dropping it removes the static guarantee for the customized name,
    #       so a later watch-list edit can silently disable the exception while
    #       workflow-ref-guard stays green -- the exact blind spot this whole
    #       comment is about, reopened on the exception path.
    #
    # The reason is NOT that it goes quiet. Day to day it is inert, and that
    # alone would only be dead weight. The reason is the VISIBILITY FLIP
    # (global.md -> Hosting & Deployment): flipping repo visibility fires the
    # legacy managed build even while Actions-source is configured, publishing
    # the UNFILTERED tree. That build is precisely what this file watches — so
    # a retry left installed will faithfully RE-RUN a rogue unfiltered deploy
    # on failure, turning a one-off exposure into a retried one. An unrepointed
    # monitor fails to notice; an unrepointed retry participates.
    #
    # Why, and the narrow exception for a provably idempotent deploy (which
    # also requires a written REVISIT TRIGGER, not just the reasoning):
    # docs/standards/automations.md -> Watcher Rules (W3).
    workflows: [pages-build-deployment]
    types: [completed]
permissions:
  actions: write
  contents: read

# ── NO `concurrency` BLOCK HERE, AND ITS ABSENCE IS THE DECISION ──────────────
# This repo carried one (`group: pages-retry`, `cancel-in-progress: false`) from
# 2026-08-26 (#249) until 2026-10-15. It is GONE, and removing it is a SAFETY
# change rather than an alignment one — claude.directives#455 ruled the same way
# on the same reasoning.
#
# WHY IT WAS ADDED: each job re-runs the ORIGINAL SHA of the run that triggered
# it, so two managed Pages runs failing in one outage start two INDEPENDENT
# retries, and the older one can redeploy STALE CONTENT OVER THE NEWER COMMIT.
# Serializing was meant to stop them interleaving.
#
# ⚠️ WHY IT HAD TO GO: the group makes the obsolescence check below able to lose
# the ONE retry that should happen. Only one run may be PENDING in a concurrency
# group — a newly queued run CANCELS the pending one even with
# `cancel-in-progress: false`, which governs the RUNNING run only. Retries fire
# off `workflow_run` completion events, which need not arrive in deploy order,
# so:
#
#     retry(A, oldest) starts, holds the group
#     retry(C, newest) queues  -> pending
#     retry(B, middle) queues  -> CANCELS pending C; B becomes pending
#     A runs its check, sees a newer deploy exists -> exits 0, no re-run
#     B runs its check, sees C is newer            -> exits 0, no re-run
#     C was cancelled                              -> NOTHING IS RETRIED
#
# Without the group all three run concurrently, A and B decline on the check,
# and C re-runs — the correct outcome. So the check does the ordering job the
# group was added for, and the group now only supplies a way to drop the newest
# retry. A guard that makes its neighbour unsafe goes.
#
# ⚠️ Do NOT re-add it to "stop interleaving". Two retries overlapping is
# harmless now: each one asks whether a newer run exists before re-running, so
# at most the newest re-runs and the others exit 0. Interleaving was only ever a
# problem while the check did not exist.
jobs:
  retry:
    # Only when the Pages deploy failed, and only for the first few attempts.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 4
    runs-on: ubuntu-latest
    # Raised 5 -> 10 with the backoff below. Worst case is 90s of initial wait
    # (30s x ATTEMPT, and the `if` above caps ATTEMPT at 3) plus 20+40+80+160s of
    # call retries = 390s ≈ 6.5 min, which would have been killed at 5. Upstream's
    # version of this comment says 5.2 min; that is arithmetically wrong, though
    # its conclusion — that 10 is enough and 5 was not — still holds.
    timeout-minutes: 10
    steps:
      - name: Re-run the failed Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          # The triggering workflow's own id. Used to look for NEWER runs of the
          # same workflow — see the obsolescence check below for why this is an
          # id and not a name.
          WF_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          set -euo pipefail
          echo "Pages deploy run ${RUN_ID} (commit ${SHA:0:7}) failed on attempt ${ATTEMPT}."
          echo "Re-running — transient 'try again later' publish failures clear on retry."

          # ⚠️ THE RE-RUN CALL ITSELF MUST BE RETRIED, and this is the whole point of the
          # change (2026-08-17). This workflow is a CHAIN: each link exists because the
          # previous attempt's failure fired a workflow_run event. So if `gh run rerun`
          # fails, NO new attempt is created, no event fires, and the chain is dead —
          # silently, forever, with nothing but a red X on a job nobody watches.
          #
          # That is not hypothetical. On 2026-08-17 the Pages deployment API returned 503
          # for commit 2e81e18; this workflow fired correctly three seconds later and its
          # own `gh run rerun` came back:
          #     failed to rerun: HTTP 503: No server is currently available...
          # The job exited 1, attempt 2 was never created, and the site stayed on the
          # previous build until a human re-triggered it by hand.
          #
          # The failure is CORRELATED by construction: the call goes to the same service
          # that just 503'd, so the moment it is most likely to fail is precisely the
          # outage this workflow exists for. A single-shot call cannot survive its own
          # use case.
          #
          # ⚠️ AND THE OLD 20s WAS TOO FAST TO HELP. Attempts were 20s apart with a
          # ceiling of 4, so the entire retry budget was spent inside about a minute —
          # against an outage that ran for several. On that same commit the deploy 503'd
          # on attempts 1, 2 AND 3 and only succeeded on the 4th, roughly six minutes
          # later, and only because the attempts were being spaced by hand. Scaling the
          # initial wait by attempt number is what makes four attempts span minutes
          # instead of seconds; it costs nothing, since a deploy nobody is waiting on
          # synchronously does not care about 90 seconds.
          sleep $(( 30 * ATTEMPT ))

          # Full re-run (not just failed jobs): re-running the whole run is what
          # reliably clears the transient publish error.
          ok=0
          for wait in 0 20 40 80 160; do
            [ "$wait" -gt 0 ] && { echo "re-run request failed; waiting ${wait}s"; sleep "$wait"; }

            # ⚠️ REJECT AN OBSOLETE RUN — this is the WHOLE of what prevents a stale
            # redeploy, and since 2026-10-15 it is the only thing here that does: the
            # `concurrency` block that used to sit above was removed because it could
            # cancel the newest pending retry and leave nothing re-run at all (the
            # header says how). Since this job re-runs its OWN event's RUN_ID, an
            # older retry executing second would republish an OLDER commit over a
            # newer one. Only checking closes that, and it is re-checked on EVERY
            # attempt because the waits above can span minutes and a newer deploy can
            # land mid-loop.
            #
            # ⚠️ KNOWN LIMIT (claude.directives#455, owner ruling): this check and the
            # re-run request are two API calls, so a newer run created in the
            # sub-second gap between them is missed. Judged not worth a
            # poll-and-cancel loop.
            #
            # ⚠️ KEYED ON workflow_id, NEVER ON A NAME. The managed Pages workflow
            # reports TWO different names: the workflows API calls it
            # "pages-build-deployment" (the slug the `workflows:` trigger above must
            # use), while the RUNS API calls it "pages build and deployment" (prose,
            # spaces). Filtering runs by the slug therefore matches NOTHING — the max
            # would fall through to 0, never exceed RUN_ID, and this guard would
            # silently never fire while looking correct. Verified against the live API
            # 2026-08-26.
            #
            # If the check itself cannot run, PROCEED rather than skip: an
            # unverifiable check is not evidence of obsolescence, and skipping would
            # silently abandon a deploy the site is waiting on. The stale overwrite
            # needs a rare double-failure; an abandoned deploy needs only a flaky API.
            if newest=$(gh api "repos/${REPO}/actions/workflows/${WF_ID}/runs?per_page=1" \
                          --jq '.workflow_runs[0].id // 0'); then
              if [ "${newest:-0}" -gt "${RUN_ID}" ]; then
                echo "::notice::Pages run ${RUN_ID} (commit ${SHA:0:7}) is superseded by newer run ${newest} — skipping the re-run so an older commit is not republished over a newer one."
                exit 0
              fi
            else
              echo "::warning::Could not determine whether run ${RUN_ID} is superseded; proceeding with the re-run."
            fi

            # A failing command in an `if` CONDITION does not trip `set -e`, which is what
            # lets the loop keep going — this call is expected to fail sometimes; that is
            # the entire reason the loop exists.
            if gh run rerun "${RUN_ID}" --repo "${REPO}"; then ok=1; break; fi
          done

          if [ "$ok" -ne 1 ]; then
            # Fail LOUDLY rather than exiting 0 on a deploy that never got re-triggered.
            # pages-monitor.yml opens the tracking issue; this annotation is what tells a
            # human the automation gave up rather than that it was never needed.
            echo "::error::Could not re-trigger Pages deploy ${RUN_ID} after 5 attempts — the deploy API is still refusing. The site is serving the PREVIOUS build; re-run it by hand once githubstatus.com is clear."
            exit 1
          fi
          echo "Requested re-run of Pages deploy ${RUN_ID}."

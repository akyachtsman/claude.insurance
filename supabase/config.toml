# Supabase project config, versioned so a deploy flag is not a sentence in a
# comment that the next person has to remember.
#
# ⚠️ BOTH FUNCTIONS NOW PIN `verify_jwt = true` AT THE BOTTOM OF THIS FILE.
# This heading used to read "THERE IS NO [functions.help-ask] BLOCK, AND ITS
# ABSENCE IS DELIBERATE" — which was true until 2026-10-14 and then described the
# exact configuration that FAILED to correct a live `false`. See the measurement
# at the bottom: an absent block preserves, it does not default. The argument
# below is still the record of why `verify_jwt = false` was wrong; it is not a
# reason to leave the flag unstated.
#
# An earlier version of this file pinned `verify_jwt = false` for help-ask and
# argued that the gateway flag "adds no protection" and "can reject the CORS
# preflight". BOTH HALVES WERE WRONG, and both were testable from here all along
# — the retired `desk-ask` stub WAS deployed with verify_jwt = true, which made
# it a live control. ⚠️ That stub was DELETED by the owner on 2026-10-14, so the
# measurement below stands but cannot be re-run against it. Probed 2026-10-07:
#
#   OPTIONS, browser preflight headers, no Authorization
#     -> the STUB'S OWN body {"ok":false,"error":"gone"}, with
#        x-deno-execution-id and x-served-by: supabase-edge-runtime.
#        The preflight REACHES the function. verify_jwt does not block it.
#   POST, no Authorization   -> UNAUTHORIZED_NO_AUTH_HEADER, no execution id
#   POST, "Bearer not-a-jwt" -> UNAUTHORIZED_INVALID_JWT_FORMAT, no execution id
#        The function never ran. The gateway absorbed both.
#
# So the flag costs nothing and buys the thing this feature most needs: junk
# traffic dies before it is a billable invocation, instead of being parsed by the
# handler and (with any bearer present) causing an Auth round trip. help-ask
# deploys with verify_jwt = true.
#
# ⚠️⚠️ AND "JUNK TRAFFIC" MEANS KEYLESS TRAFFIC — `verify_jwt` IS NOT USER
# AUTHENTICATION, WHICH THE SENTENCE ABOVE READS AS CLAIMING. Raised by Codex on
# #271, and it is right. The key embedded in the browser bundle at
# js/supabase.js is `sb_publishable_…`, which is **NOT a JWT** — only the LEGACY
# `anon` key was JWT-based. Supabase currently lets publishable keys pass the
# gateway's check for migration compatibility, so a key holder reaches the worker
# anyway, and the exposure this flag is credited with closing (a billable
# invocation, an Auth round trip) is NOT closed for them.
#
# ⚠️ THE DISTINCTION IS NOT PEDANTRY, and a first version of this correction got
# it wrong by writing "the gateway checks for a valid project JWT, and the
# publishable key is one". Codex on #272: describing a non-JWT API key as a JWT
# documents the wrong mechanism and invites the next change to treat it as a USER
# token — handing it to `getUser()`, say, where it identifies nobody. It is an
# API key accepted by a compatibility check, and legacy anon JWTs are a separate
# thing. See Supabase's API-key reference for both formats.
#
# What the flag actually stops is the 2026-10-07 probe's own two cases: a POST
# with NO Authorization, and one with a malformed bearer. Both died at the
# gateway with no execution id. That is worth having and it is all it is.
#
# ⚠️ THE USER GATE IS IN THE HANDLER, AND ALWAYS WAS: `if (!authz) 401`, then
# `getUser()` must return a user, then every read OF THAT CLIENT'S OWN RECORDS
# runs as them under RLS, through `userDb`. Nothing here depends on the gateway
# for identity, so this correction changes no behaviour — only a claim. Do not
# "harden" by removing the flag either: keyless junk dying early is still a real
# saving.
#
# ⚠️ "EVERY TABLE READ" WAS TOO BROAD, and the narrowing matters because it is
# the service-role boundary a future privilege change has to preserve (Codex,
# #272). help-ask deliberately reads TWO tables through the `admin`
# (service-role) client and not as the caller: `help_settings` at handler.ts 209,
# because its policies are broker-only and a CLIENT must still get an answer; and
# `help_queries` at 565/605/709/732/749/790, because the throttle must count rows
# the client holds no privilege on at all. Both are documented in CLAUDE.md as
# load-bearing grants. The caller-scoped client covers the CLIENT RECORDS —
# entities, assets, policies, profiles — and that is the claim.
# (notify-enhancement is the stricter case: every TABLE access there is the
# caller's, under RLS. It has TWO service-role surfaces, and BOTH must be kept
# in view by any future privilege change — ⚠️ a first version of this sentence
# named only the first and called it "its one service-role use", which is
# exactly the kind of omission that gets a load-bearing grant dropped as
# unused (Codex, #273):
#   · `authAdmin` (index.ts 490) → `auth.admin.getUserById` (775). The GoTrue
#     ADMIN API, not a table — it resolves the client's email on the approved
#     path, where the caller is the underwriter and `profiles` has no email
#     column. Unaffected by Postgres table grants, which is why it works where
#     the old service-role table reads did not.
#   · `claims` (405) → `claim_notification` (433). A table-adjacent surface and
#     the one that is easy to miss: the RPC is SECURITY DEFINER with EXECUTE
#     granted to `service_role` ONLY, it reads `enhancement_requests` and
#     inserts into the server-only `enhancement_notifications`, and
#     `authenticated` holds nothing on either the table or the function. That
#     grant is the whole point of the claim redesign — revoking it as "unused"
#     would make every claim fail and silence the notifications.)
#
# ⚠️ NOT MEASURED FROM HERE, and stated rather than assumed: HTTPS egress to the
# project is blocked from a session, so the publishable-key path has not been
# exercised against the live gateway. The smoke probe in functions-deploy.yml
# sends NO apikey, so it tests the keyless path only — it is not evidence either
# way about the key-bearing one, and a probe asserting unmeasured gateway
# behaviour would be a guess that can turn CI red.
#
# Two further corrections to what that block claimed: only the CLI reads this
# file, and the Supabase MCP deploy tool this project uses takes `verify_jwt` as
# an explicit parameter defaulting to TRUE — so the file never could have stopped
# a redeploy flipping anything, and the default it was overriding was the safe one.
project_id = "bdsegmjcgfmgzuxwiplj"

# ⚠️ THE [functions.notify-enhancement] BLOCK WAS REMOVED 2026-10-13 AND IS BACK
# AT THE BOTTOM OF THIS FILE, now pinning `verify_jwt = true`. The sentence that
# followed this heading — "so this function now takes the DEFAULT" — is exactly
# the belief that let a live `false` survive a successful deploy on 2026-10-14.
# Removing a block does not take the default; it takes whatever is already live.
#
# It used to pin `verify_jwt = false`, and the stated reason was that the
# function "accepts a service-role caller as well as a signed-in one and
# implements both checks itself". THAT REASON HAS BEEN RETIRED: the rewrite
# dropped the service-role caller path. Nothing used it (the only callers are
# js/keep/views/policies-view.js and approveEnhancement() in js/supabase.js, both
# browser-side with the user's JWT), and it could never have worked anyway —
# `service_role` holds no table privileges in this project, so a service-role
# invocation failed on its first query like every other one. Every real caller is
# a signed-in client, so the gateway flag now costs nothing and kills KEYLESS
# junk traffic before it is a billable invocation — see the correction above:
# `verify_jwt` is not user authentication, and the publishable key passes it.
#
# ✅ AND IT IS `true` ON THE LIVE DEPLOYMENT AS OF 2026-10-14, when
# functions-deploy.yml gained notify-enhancement as a second matrix row and
# deployed it from the runner's checkout. Because there is no block here, the CLI
# applied the default — which is the whole mechanism, and the only reason this
# file's absence of a block is load-bearing rather than tidiness.
#
# ⚠️ IT WAS `false` UNTIL THEN, AND REMOVING THE BLOCK IS NOT WHAT CHANGED IT.
# Measured 2026-10-14 before that deploy: ACTIVE, version 2, verify_jwt FALSE,
# entrypoint under /tmp/user_fn_… — an old inline tool-call deploy. Only the CLI
# reads this file, so a config edit alone can never move a live flag; it takes
# effect on the next deploy THROUGH THE CLI. (The Supabase MCP's deploy tool,
# which is how that version 2 got there, takes verify_jwt as an explicit
# parameter and ignores this file entirely.)

# ⚠️⚠️ BOTH FUNCTIONS NOW PIN `verify_jwt = true` EXPLICITLY, AND THE REASONING
# ABOVE — THAT AN ABSENT BLOCK MEANS "THE CLI APPLIES THE DEFAULT (true)" — IS
# FALSE FOR A FUNCTION THAT ALREADY EXISTS. Measured 2026-10-14, and the smoke
# probe is what caught it:
#
#   `supabase functions deploy notify-enhancement` with NO block here succeeded,
#   uploaded the repo's source (version 3, entrypoint under /home/runner/work/…)
#   — and the function stayed `verify_jwt: false`. An unauthenticated POST then
#   reached the HANDLER, which answered its own {"error":"unauthorized"}, which
#   is exactly what probe 2 exists to detect. Confirmed in function_edge_logs:
#   `OPTIONS | 200` then `POST | 401`, and `list_edge_functions` still reporting
#   false afterwards.
#
# So an absent block does not ASSERT the default — it sends nothing, and the
# platform keeps whatever the function already had. help-ask only ever looked
# like evidence for the old reading because it was ALREADY true, so "preserve"
# and "apply the default" were indistinguishable on the one function being
# deployed. One function with a false flag separated them.
#
# ⚠️ This does NOT reinstate the thing the long comment at the top is against.
# That argument is about pinning `verify_jwt = FALSE`, which was wrong on its
# merits and is still wrong. Pinning TRUE is its opposite: it states the intended
# end state instead of inheriting whatever is live, so a function that somehow
# acquires `false` is corrected by the next deploy rather than keeping it
# forever. An inherited default is not a decision; this is.
[functions.help-ask]
verify_jwt = true

[functions.notify-enhancement]
verify_jwt = true
